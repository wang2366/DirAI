<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="250" fill="#fff"/>
<text x="450" y="30" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Works while you sleep: one night of an agent</text>
<rect x="268" y="60" width="468" height="110" rx="8" fill="#eef0f7"/>
<text x="346" y="76" font-size="12" fill="#6b7394" text-anchor="middle">you are asleep</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#888" stroke-width="2"/>
<line x1="60" y1="115" x2="60" y2="125" stroke="#888"/>
<text x="60" y="142" font-size="11" fill="#777" text-anchor="middle">18:00</text>
<line x1="164" y1="115" x2="164" y2="125" stroke="#888"/>
<text x="164" y="142" font-size="11" fill="#777" text-anchor="middle">20:00</text>
<line x1="268" y1="115" x2="268" y2="125" stroke="#888"/>
<text x="268" y="142" font-size="11" fill="#777" text-anchor="middle">22:00</text>
<line x1="372" y1="115" x2="372" y2="125" stroke="#888"/>
<text x="372" y="142" font-size="11" fill="#777" text-anchor="middle">00:00</text>
<line x1="476" y1="115" x2="476" y2="125" stroke="#888"/>
<text x="476" y="142" font-size="11" fill="#777" text-anchor="middle">02:00</text>
<line x1="580" y1="115" x2="580" y2="125" stroke="#888"/>
<text x="580" y="142" font-size="11" fill="#777" text-anchor="middle">04:00</text>
<line x1="684" y1="115" x2="684" y2="125" stroke="#888"/>
<text x="684" y="142" font-size="11" fill="#777" text-anchor="middle">06:00</text>
<line x1="788" y1="115" x2="788" y2="125" stroke="#888"/>
<text x="788" y="142" font-size="11" fill="#777" text-anchor="middle">08:00</text>
<circle cx="86" cy="120" r="7" fill="#3d6fae"/>
<line x1="86" y1="113" x2="86" y2="102" stroke="#3d6fae"/>
<text x="86" y="82" font-size="12" fill="#3d6fae" text-anchor="middle" font-weight="bold">You: "rerun the fit</text>
<text x="86" y="96" font-size="12" fill="#3d6fae" text-anchor="middle">with 10x the data"</text>
<circle cx="112" cy="120" r="7" fill="#2f7d4a"/>
<line x1="112" y1="127" x2="112" y2="158" stroke="#2f7d4a"/>
<text x="112" y="174" font-size="12" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Agent submits</text>
<text x="112" y="188" font-size="12" fill="#2f7d4a" text-anchor="middle">200 cluster jobs</text>
<circle cx="554" cy="120" r="7" fill="#555"/>
<line x1="554" y1="113" x2="554" y2="102" stroke="#555"/>
<text x="554" y="82" font-size="12" fill="#555" text-anchor="middle" font-weight="bold">Jobs finish; DirAI</text>
<text x="554" y="96" font-size="12" fill="#555" text-anchor="middle">wakes the agent</text>
<circle cx="580" cy="120" r="7" fill="#2f7d4a"/>
<line x1="580" y1="127" x2="580" y2="158" stroke="#2f7d4a"/>
<text x="580" y="174" font-size="12" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Agent updates plots</text>
<text x="580" y="188" font-size="12" fill="#2f7d4a" text-anchor="middle">and its report</text>
<circle cx="788" cy="120" r="7" fill="#3d6fae"/>
<line x1="788" y1="113" x2="788" y2="102" stroke="#3d6fae"/>
<text x="788" y="82" font-size="12" fill="#3d6fae" text-anchor="middle" font-weight="bold">You: read the result,</text>
<text x="788" y="96" font-size="12" fill="#3d6fae" text-anchor="middle">changes in yellow</text>
<text x="450" y="232" font-size="12" fill="#555" text-anchor="middle">Tokens are used only while the agent works: waiting for jobs is free (checked every 10 min).</text>
</svg>
