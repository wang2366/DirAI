<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><style>.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#666}.b{font-size:12px;fill:#222}.l{font-size:11px;fill:#333}.n{font-size:11px;font-weight:bold}.m{font-size:12px;font-family:monospace;fill:#222}.c{font-size:11px;fill:#8a6d1f}</style></defs>
<rect width="960" height="520" fill="#ffffff"/>
<text x="480" y="30" class="t" text-anchor="middle" fill="#222">DirAI: every folder with an index.html is an agent you chat with in the browser</text>
<rect x="20" y="50" width="280" height="270" rx="10" fill="#eef4fb" stroke="#3d6fae" stroke-width="1.5"/>
<text x="32" y="72" class="t" fill="#3d6fae">Your browser</text>
<text x="32" y="88" class="s">http://127.0.0.1:&lt;port&gt;</text>
<rect x="34" y="98" width="252" height="86" rx="5" fill="#fff" stroke="#9db6d6"/>
<text x="44" y="116" class="b" text-anchor="start">Agent list  (www/index.html)</text>
<circle cx="50" cy="132" r="4" fill="#3f8f5a"/>
<text x="60" y="136" class="m" text-anchor="start">projA</text>
<text x="276" y="136" class="l" text-anchor="end">done</text>
<circle cx="50" cy="150" r="4" fill="#d08a00"/>
<text x="60" y="154" class="m" text-anchor="start">projA/fit</text>
<text x="276" y="154" class="l" text-anchor="end">running</text>
<circle cx="50" cy="168" r="4" fill="#c0392b"/>
<text x="60" y="172" class="m" text-anchor="start">projB</text>
<text x="276" y="172" class="l" text-anchor="end">needs you</text>
<rect x="34" y="194" width="252" height="114" rx="5" fill="#fff" stroke="#9db6d6"/>
<text x="44" y="212" class="b" text-anchor="start">Agent page  (projA/index.html)</text>
<rect x="44" y="220" width="140" height="34" rx="3" fill="#f4f4f4" stroke="#ccc"/>
<text x="50" y="234" class="l" text-anchor="start">Summary card</text>
<text x="50" y="248" class="s" text-anchor="start">Objective · Result · Open</text>
<rect x="44" y="260" width="140" height="10" fill="#fff3a8"/>
<rect x="44" y="276" width="140" height="8" fill="#eee"/>
<rect x="44" y="290" width="100" height="8" fill="#eee"/>
<text x="114" y="268" class="s" text-anchor="middle">changed: yellow</text>
<rect x="194" y="220" width="84" height="80" rx="3" fill="#f7f9fc" stroke="#9db6d6"/>
<text x="200" y="234" class="l" text-anchor="start">Chat</text>
<rect x="214" y="240" width="58" height="12" rx="6" fill="#d7e5f7"/>
<rect x="200" y="256" width="58" height="12" rx="6" fill="#e9e9e9"/>
<rect x="200" y="276" width="72" height="16" rx="2" fill="#fff" stroke="#bbb"/>
<text x="204" y="288" class="s" text-anchor="start">Enter = send</text>
<rect x="390" y="50" width="240" height="250" rx="10" fill="#f4effb" stroke="#6f4fae" stroke-width="1.5"/>
<text x="402" y="72" class="t" fill="#6f4fae">DirAI server</text>
<text x="402" y="88" class="s">one per tree · port in www/dirai.json</text>
<text x="404" y="112" class="b" text-anchor="start">• serves pages (owner key login)</text>
<text x="404" y="134" class="b" text-anchor="start">• builds the agent list</text>
<text x="404" y="156" class="b" text-anchor="start">• queues runs, 5 at a time</text>
<text x="404" y="178" class="b" text-anchor="start">• pauses at your usage levels</text>
<text x="404" y="200" class="b" text-anchor="start">• sends scheduled messages</text>
<text x="413" y="222" class="b" text-anchor="start">(once / daily / weekly / hourly)</text>
<text x="404" y="244" class="b" text-anchor="start">• waits for the runs' SLURM jobs</text>
<text x="404" y="266" class="b" text-anchor="start">• asks you about blocked actions</text>
<rect x="700" y="50" width="240" height="450" rx="10" fill="#fbf6ea" stroke="#a07a1c" stroke-width="1.5"/>
<text x="712" y="72" class="t" fill="#a07a1c">The tree</text>
<text x="712" y="88" class="s">a git repo or any folder DirAI start serves</text>
<text x="716" y="108" class="m" text-anchor="start">my-repo/</text>
<text x="734" y="135" class="m" text-anchor="start">CLAUDE.md</text>
<text x="930" y="135" class="c" text-anchor="end">imports agent rules</text>
<text x="734" y="162" class="m" text-anchor="start">projA/</text>
<rect x="748" y="176" width="78" height="18" rx="3" fill="#e3f1e7" stroke="#3f8f5a"/>
<text x="752" y="189" class="m" text-anchor="start">index.html</text>
<text x="930" y="189" class="c" text-anchor="end">agent</text>
<text x="752" y="216" class="m" text-anchor="start">fit.py  fit.png</text>
<text x="752" y="243" class="m" text-anchor="start">fit/</text>
<rect x="766" y="257" width="78" height="18" rx="3" fill="#e3f1e7" stroke="#3f8f5a"/>
<text x="770" y="270" class="m" text-anchor="start">index.html</text>
<text x="930" y="270" class="c" text-anchor="end">agent</text>
<text x="734" y="297" class="m" text-anchor="start">projB/</text>
<rect x="748" y="311" width="78" height="18" rx="3" fill="#e3f1e7" stroke="#3f8f5a"/>
<text x="752" y="324" class="m" text-anchor="start">index.html</text>
<text x="930" y="324" class="c" text-anchor="end">agent</text>
<text x="734" y="351" class="m" text-anchor="start">notes/</text>
<text x="930" y="351" class="c" text-anchor="end">not an agent</text>
<text x="734" y="378" class="m" text-anchor="start">www/</text>
<text x="930" y="378" class="c" text-anchor="end">generated, gitignored</text>
<text x="752" y="405" class="m" text-anchor="start">index.html</text>
<text x="930" y="405" class="c" text-anchor="end">agent list</text>
<text x="752" y="432" class="m" text-anchor="start">agents.json</text>
<text x="930" y="432" class="c" text-anchor="end">chat threads</text>
<text x="752" y="459" class="m" text-anchor="start">dirai.json</text>
<text x="930" y="459" class="c" text-anchor="end">port, settings</text>
<rect x="390" y="370" width="240" height="130" rx="10" fill="#eef8f0" stroke="#2f7d4a" stroke-width="1.5"/>
<text x="402" y="392" class="t" fill="#2f7d4a">A Claude Code run</text>
<text x="402" y="408" class="s">claude -p, in the agent's folder</text>
<text x="404" y="426" class="b" text-anchor="start">• reads index.html + your message</text>
<text x="404" y="444" class="b" text-anchor="start">• edits index.html, reruns scripts</text>
<text x="404" y="462" class="b" text-anchor="start">• may edit only its own folder</text>
<text x="404" y="480" class="b" text-anchor="start">• replies in 3 short lines</text>
<rect x="20" y="370" width="280" height="130" rx="10" fill="#f3f3f3" stroke="#555" stroke-width="1.5"/>
<text x="32" y="392" class="t" fill="#555">SLURM</text>
<text x="32" y="408" class="s">for long or heavy work</text>
<text x="34" y="426" class="b" text-anchor="start">• jobs the run submitted with sbatch</text>
<text x="34" y="442" class="b" text-anchor="start">• checked with sacct every 10 min</text>
<text x="43" y="458" class="b" text-anchor="start">(no tokens used while waiting)</text>
<text x="34" y="474" class="b" text-anchor="start">• when all finish: a new run gets</text>
<text x="43" y="490" class="b" text-anchor="start">their results</text>
<line x1="300" y1="120" x2="390" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="345" cy="138" r="9" fill="#333"/>
<text x="345" y="142" class="n" text-anchor="middle" fill="#fff">1</text>
<text x="345" y="162" class="l" text-anchor="middle">you send</text>
<text x="345" y="176" class="l" text-anchor="middle">a message</text>
<line x1="510" y1="300" x2="510" y2="370" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="535" cy="330" r="9" fill="#333"/>
<text x="535" y="334" class="n" text-anchor="middle" fill="#fff">2</text>
<text x="535" y="354" class="l" text-anchor="start">starts a run</text>
<line x1="630" y1="435" x2="700" y2="435" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="665" cy="380" r="9" fill="#333"/>
<text x="665" y="384" class="n" text-anchor="middle" fill="#fff">3</text>
<text x="665" y="404" class="l" text-anchor="middle">edits</text>
<text x="665" y="418" class="l" text-anchor="middle">index.html</text>
<line x1="390" y1="470" x2="300" y2="470" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="345" cy="428" r="9" fill="#333"/>
<text x="345" y="432" class="n" text-anchor="middle" fill="#fff">4</text>
<text x="345" y="452" class="l" text-anchor="middle">sbatch</text>
<line x1="240" y1="370" x2="400" y2="300" stroke="#333" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<circle cx="300" cy="350" r="9" fill="#333"/>
<text x="300" y="354" class="n" text-anchor="middle" fill="#fff">5</text>
<text x="318" y="352" class="l" text-anchor="start">jobs done</text>
<line x1="390" y1="250" x2="300" y2="250" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="345" cy="268" r="9" fill="#333"/>
<text x="345" y="272" class="n" text-anchor="middle" fill="#fff">6</text>
<text x="345" y="292" class="l" text-anchor="middle">reply + yellow</text>
<text x="345" y="306" class="l" text-anchor="middle">changes</text>
<line x1="630" y1="175" x2="700" y2="175" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="665" y="166" class="l" text-anchor="middle">finds agents</text>
</svg>
