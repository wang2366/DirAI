<text x="450" y="178" font-size="11" fill="#777" text-anchor="middle">your free org</text>
<text x="450" y="216" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">readers: Read role</text>
<text x="450" y="234" font-size="12" fill="#777" text-anchor="middle">so they can&#x27;t push</text>
<text x="450" y="268" font-size="12" fill="#444" text-anchor="middle">one repo per audience</text>
<line x1="562" y1="150" x2="642" y2="150" stroke="#555" stroke-width="2"/>
