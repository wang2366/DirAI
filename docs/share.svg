<rect x="340" y="60" width="220" height="250" rx="10" fill="#f6f6f6" stroke="#444" stroke-width="1.5"/>
<text x="450" y="84" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">GitHub</text>
<rect x="358" y="98" width="184" height="92" rx="6" fill="#fff" stroke="#999" stroke-width="1"/>
<text x="450" y="118" font-size="12" fill="#222" text-anchor="middle" font-family="monospace">&lt;login&gt;-dirai /</text>
<text x="450" y="136" font-size="12" fill="#222" text-anchor="middle" font-family="monospace">&lt;login&gt;_agent_repo</text>
